name: CodeQL

on:
  push:
    branches: [master-1.17.1, 'feature/**']
  pull_request:
    branches: [master-1.17.1]
  schedule:
    - cron: '59 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out ElectricAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use canonical LF dependency inputs
        # Apply before every dependency checkout, including OreSpawn.
        run: git config --global core.autocrlf false
      - name: Require final PowerAdvantage pin
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          power_ref="$(sed -n 's/^poweradvantage_source_ref=//p' gradle.properties | tr -d '\r')"
          power_sha="$(sed -n 's/^poweradvantage_deobf_sha256=//p' gradle.properties | tr -d '\r')"
          pin_state="$(sed -n 's/^poweradvantage_pin_state=//p' gradle.properties | tr -d '\r')"
          if [[ "$pin_state" == "API_PIN_PROVISIONAL" || "$power_ref" != "5b9abe578b053d2ef59b1962cf9e04f6880c91b9" || "$power_sha" != "799B59B06EB2AC3FC4682AA64BF42C3A2A2C1D89D7FFFE9C72745DEC7DFBE0D8" ]]; then
            echo "PowerAdvantage 1.17.1 source/deobf pin differs from the audited candidate" >&2
            exit 1
          fi
          echo "power_ref=$power_ref" >> "$GITHUB_OUTPUT"
      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: b56e2b62a1a6ea4d1dd96f8646a87801a817dbdf
          path: .ci-dependencies/OreSpawn
      - name: Check out pinned Base Metals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/BaseMetals
          ref: dacfaa3af2e3310d5cb6b081da79f09260ae103d
          path: .ci-dependencies/BaseMetals
      - name: Check out PowerAdvantage 1.17.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/PowerAdvantage
          # Local-only Power source; publish upstream before hosted builds.
          ref: ${{ steps.pins.outputs.power_ref }}
          path: .ci-dependencies/PowerAdvantage
      - name: Install pinned Java 25 Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 16 production toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '16.0.2+7'
      - name: Install Java 8 build utilities
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Use pinned build toolchains
        # These are Gradle project properties, not JVM system properties.
        shell: bash
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_16_X64,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build 1.17.1 dependency chain
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          orespawn="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          basemetals="$GITHUB_WORKSPACE/.ci-dependencies/BaseMetals"
          power="$GITHUB_WORKSPACE/.ci-dependencies/PowerAdvantage"
          chmod +x "$orespawn/gradlew" "$basemetals/gradlew" "$power/gradlew"
          (cd "$orespawn" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar --no-daemon --stacktrace)
          (cd "$basemetals" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar --no-daemon --stacktrace)
          osjar="$orespawn/build/libs-dev/OreSpawn-4.1.0.117011-deobf.jar"
          bmjar="$basemetals/build/libs-dev/BaseMetals-3.1.0.117011-deobf.jar"
          (cd "$power" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar verifyReleaseDependencies \
            -PbaseMetalsDeobfJar="$bmjar" -PoreSpawnDeobfJar="$osjar" \
            --no-daemon --stacktrace)
          powerjar="$power/build/libs-dev/PowerAdvantage-2.4.8.117011-deobf.jar"
          test -f "$osjar" && test -f "$bmjar" && test -f "$powerjar"
          echo "orespawn=$osjar" >> "$GITHUB_OUTPUT"
          echo "basemetals=$bmjar" >> "$GITHUB_OUTPUT"
          echo "power=$powerjar" >> "$GITHUB_OUTPUT"
          echo "power_ref=$(git -C "$power" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile ElectricAdvantage production code
        run: |
          chmod +x ./gradlew
          ./gradlew $MMD_GRADLE_TOOLCHAINS clean classes --rerun-tasks --no-build-cache --no-daemon --stacktrace \
            -PpowerAdvantageDeobfJar=${{ steps.dependencies.outputs.power }} \
            -Ppoweradvantage_source_ref=${{ steps.dependencies.outputs.power_ref }} \
            -PbaseMetalsDeobfJar=${{ steps.dependencies.outputs.basemetals }} \
            -PoreSpawnDeobfJar=${{ steps.dependencies.outputs.orespawn }}
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
