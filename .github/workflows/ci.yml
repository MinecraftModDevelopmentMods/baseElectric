name: baseElectric 1.20.1 CI

on:
  push:
    branches: [master-1.20.1, 'feature/**']
  pull_request:
    branches: [master-1.20.1]

permissions:
  contents: read

concurrency:
  group: baseelectric-1.20.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out baseElectric
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use canonical LF dependency inputs
        run: git config --global core.autocrlf false
      - name: Verify merged dependency pins and public basePower bytes
        id: public-pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/verify-published-pins.sh
      - name: Require coordinated 1.20.1 dependency pins
        id: pins
        run: bash .github/scripts/forge47-dependencies.sh pins
      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: ${{ steps.pins.outputs.orespawn_ref }}
          path: .ci-dependencies/OreSpawn
      - name: Check out pinned Base Metals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/BaseMetals
          ref: ${{ steps.pins.outputs.basemetals_ref }}
          path: .ci-dependencies/BaseMetals
      - name: Check out pinned basePower
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/basePower
          ref: ${{ steps.pins.outputs.power_ref }}
          path: .ci-dependencies/PowerAdvantage
      - name: Install pinned Java 25 Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 build utilities
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 for Gradle and production
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Use pinned build toolchains
        shell: bash
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build 1.20.1 dependency chain
        id: dependencies
        run: bash .github/scripts/forge47-dependencies.sh build
      - name: Build and audit release artifacts
        shell: bash
        env:
          MAVENIZER: ${{ steps.dependencies.outputs.mavenizer }}
          POWER_DEV: ${{ steps.dependencies.outputs.power }}
          POWER_PLAYER: ${{ steps.public-pins.outputs.power_player }}
          POWER_BOOTSTRAP: ${{ steps.dependencies.outputs.bootstrap }}
          POWER_AGENT: ${{ steps.dependencies.outputs.agent }}
          METALS_DEV: ${{ steps.dependencies.outputs.basemetals }}
          METALS_PLAYER: ${{ steps.dependencies.outputs.basemetals_player }}
          ORESPAWN_DEV: ${{ steps.dependencies.outputs.orespawn }}
          ORESPAWN_PLAYER: ${{ steps.dependencies.outputs.orespawn_player }}
          FORGE_INSTALLER: ${{ steps.dependencies.outputs.installer }}
        run: |
          ./gradlew $MMD_GRADLE_TOOLCHAINS build writeReleaseChecksums verifyEclipseProductionClasspath \
            "-Pforge47MavenizerJar=$MAVENIZER" "-PpowerAdvantageDeobfJar=$POWER_DEV" \
            "-PpowerAdvantageRuntimeJar=$POWER_PLAYER" "-PpowerAdvantageUnitBootstrapSource=$POWER_BOOTSTRAP" \
            "-PpowerAdvantageUnitBootstrapJar=$POWER_AGENT" "-PbaseMetalsDeobfJar=$METALS_DEV" \
            "-PbaseMetalsRuntimeJar=$METALS_PLAYER" "-PoreSpawnDeobfJar=$ORESPAWN_DEV" \
            "-PoreSpawnRuntimeJar=$ORESPAWN_PLAYER" "-PforgeInstallerJar=$FORGE_INSTALLER" \
            --no-build-cache --no-daemon --stacktrace
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseElectric-1.20.1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/baseElectric-2.2.13.120011.jar
            build/libs/baseElectric-2.2.13.120011-sources.jar
            build/libs/baseElectric-2.2.13.120011-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseElectric-1.20.1-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
            .ci-dependencies/PowerAdvantage/build/reports/**
            .ci-dependencies/PowerAdvantage/build/libs-dev/*.jar
