name: baseElectric 1.20.6 CI

on:
  push:
    branches: [master-1.20.6, 'feature/**']
  pull_request:
    branches: [master-1.20.6]

permissions:
  contents: read

concurrency:
  group: baseelectric-1.20.6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out baseElectric
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use canonical LF dependency inputs
        run: git config --global core.autocrlf false
      - name: Verify merged and public dependency pins
        id: public-pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/verify-published-pins.sh
      - name: Check out pinned OreSpawn tool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: ${{ steps.public-pins.outputs.orespawn_ref }}
          path: .ci-dependencies/OreSpawn
      - name: Check out released basePower source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/basePower
          ref: ${{ steps.public-pins.outputs.power_ref }}
          path: .ci-dependencies/basePower
      - name: Install Java 25 for Mavenizer
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 for the launcher helper
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 21 for Gradle and production
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - name: Use pinned build toolchains
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Verify the Forge 50 build inputs
        shell: bash
        env:
          ORESPAWN_REF: ${{ steps.public-pins.outputs.orespawn_ref }}
          POWER_REF: ${{ steps.public-pins.outputs.power_ref }}
        run: |
          set -euo pipefail
          orespawn="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          power="$GITHUB_WORKSPACE/.ci-dependencies/basePower"
          test "$(git -C "$orespawn" rev-parse HEAD)" = "$ORESPAWN_REF"
          test "$(git -C "$power" rev-parse HEAD)" = "$POWER_REF"
          mavenizer="$orespawn/ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar"
          printf '%s  %s\n' '4B14145595E900F178A082F2253A756F63897E6F61C2B8B5E7C819B82CD79E8C' "$mavenizer" | sha256sum -c -
          echo "MAVENIZER=$mavenizer" >> "$GITHUB_ENV"
      - name: Build and audit release artifacts
        shell: bash
        run: |
          ./gradlew $MMD_GRADLE_TOOLCHAINS clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts \
            writeReleaseChecksums verifyEclipseProductionClasspath --no-build-cache --no-daemon --stacktrace \
            "-Pforge50MavenizerJar=$MAVENIZER" "-PpowerAdvantageDeobfJar=$POWER_PLAYER" \
            "-PbaseMetalsDeobfJar=$METALS_PLAYER" "-PoreSpawnDeobfJar=$ORESPAWN_PLAYER" \
            "-PforgeInstallerJar=$FORGE_INSTALLER"
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseElectric-1.20.6-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/baseElectric-2.2.14.120061.jar
            build/libs/baseElectric-2.2.14.120061-sources.jar
            build/libs/baseElectric-2.2.14.120061-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseElectric-1.20.6-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
