import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// OreSpawn's audited Forge 45 fixture fixes eight decompiled record accessors.
def fixturePath = providers.gradleProperty('forge45MavenizerJar').orNull
if (fixturePath == null) fixturePath = project.findProperty('forge45MavenizerDefault')
if (!fixturePath || fixturePath.isBlank()) {
    throw new GradleException('Set -Pforge45MavenizerJar to the pinned OreSpawn Forge 45 Mavenizer fixture.')
}
File fixture = file(fixturePath)
if (!fixture.isFile()) {
    throw new GradleException("Forge 45 Mavenizer fixture not found: ${fixture}. Use -Pforge45MavenizerJar=<path>.")
}
def expected = '341B3FB10ABA6EA7DC612FBE519DC290A1C81867AED5DD320ACD783688AC49DE'
def actual = MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
if (actual != expected) {
    throw new GradleException("Forge 45 Mavenizer fixture SHA-256 mismatch: expected ${expected}, got ${actual}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
