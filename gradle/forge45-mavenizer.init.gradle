// Apply Electric's setup to the pinned Power source without changing that checkout.
gradle.beforeProject { Project p ->
    if (p == p.rootProject) {
        p.pluginManager.withPlugin('net.minecraftforge.gradle') {
            def script = p.providers.gradleProperty('forge45MavenizerScript').orNull
            def fixture = p.providers.gradleProperty('forge45MavenizerJar').orNull
            if (!script || !new File(script).isAbsolute() || !fixture || !new File(fixture).isAbsolute()) {
                throw new GradleException('Pass absolute -Pforge45MavenizerScript and -Pforge45MavenizerJar paths.')
            }
            p.apply(from: p.file(script))
        }
    }
}
