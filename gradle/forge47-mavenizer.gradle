import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// OreSpawn's audited fixture repairs the Forge 47 decompiled sources.
def fixturePath = providers.gradleProperty('forge47MavenizerJar').orNull
if (fixturePath == null) fixturePath = project.findProperty('forge47MavenizerDefault')
if (!fixturePath || fixturePath.isBlank()) {
    throw new GradleException('Set -Pforge47MavenizerJar to the pinned OreSpawn Forge 47 Mavenizer fixture.')
}
File fixture = file(fixturePath)
if (!fixture.isFile()) {
    throw new GradleException("Forge 47 Mavenizer fixture not found: ${fixture}. Use -Pforge47MavenizerJar=<path>.")
}
def expected = '416DCA4797BC55826F0DDCF03FDC405F1990FC15C2133FA27A1F143BF7976177'
def actual = MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
if (actual != expected) {
    throw new GradleException("Forge 47 Mavenizer fixture SHA-256 mismatch: expected ${expected}, got ${actual}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
