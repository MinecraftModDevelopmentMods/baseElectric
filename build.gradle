def quoteEclipseLaunchPaths = { String name, String arguments ->
    if (arguments.contains('--to-srg') || arguments.contains('--to-obf')) {
        throw new GradleException("${name} must not remap the official Forge 64 runtime")
    }
    // ForgeGradle flattens path arguments without quoting them for Eclipse.
    Map<String, String> nextOptions = [
            '--cache': '--metadata', '--metadata': '--'
    ]
    if (name == 'runData.launch') {
        nextOptions.put('--output', '--existing')
        nextOptions.put('--existing', null)
    }
    nextOptions.each { String option, String next ->
        String prefix = " ${option} "
        int start = arguments.indexOf(prefix)
        if (start < 0) {
            throw new GradleException("${name} is missing path argument ${option}")
        }
        start += prefix.length()
        int end = next == null ? arguments.length() : arguments.indexOf(" ${next} ", start)
        if (end <= start) {
            throw new GradleException("${name} has malformed path argument ${option}")
        }
        String value = arguments.substring(start, end)
        if (value.find(/\s/) != null && !(value.startsWith('"') && value.endsWith('"'))) {
            arguments = arguments.substring(0, start) + '"' + value + '"' + arguments.substring(end)
        }
    }
    arguments
}

def nativeEclipseAssets = {
    File nativeJar = nativeResourceCheckClasspath.get().files.find {
        it.name == "forge-${project.minecraft_version}-${project.forge_version}.jar"
    }
    if (nativeJar == null) throw new GradleException('Missing native client metadata input')
    File metadata = new File(nativeJar.parentFile,
            "forge-${project.minecraft_version}-${project.forge_version}-metadata.zip")
    def version
    new ZipFile(metadata).withCloseable { zip ->
        def entry = zip.getEntry('minecraft/version.json')
        if (entry == null) throw new GradleException('Native metadata has no Minecraft version descriptor')
        version = new JsonSlurper().parse(zip.getInputStream(entry))
    }
    if (version.id != project.minecraft_version || !(version.assetIndex.sha1 ==~ /[a-f0-9]{40}/)) {
        throw new GradleException('Unexpected native Minecraft asset metadata')
    }
    File assets = file(providers.gradleProperty('minecraftAssetsDir').getOrElse(
            new File(System.getenv('APPDATA') ?: System.getProperty('user.home'), '.minecraft/assets').path))
    [id: version.assetIndex.id.toString(), sha1: version.assetIndex.sha1.toString(), root: assets.canonicalPath]
}

def resolveEclipseClientAssets = { String arguments ->
    def assets = nativeEclipseAssets()
    arguments.replace('{asset_index}', assets.id).replace('{assets_root}', '"' + assets.root + '"')
}

tasks.register('verifyEclipseLaunchArguments') {
    group = 'verification'
    description = 'Checks official-name launch paths and actual native asset metadata without starting Minecraft.'
    doLast {
        String sample = '--main native --cache D:/cache with spaces --metadata D:/metadata with spaces -- --launchTarget forge_userdev_client'
        String expected = '--main native --cache "D:/cache with spaces" --metadata "D:/metadata with spaces" -- --launchTarget forge_userdev_client'
        if (quoteEclipseLaunchPaths('runClient.launch', sample) != expected
                || quoteEclipseLaunchPaths('runClient.launch', expected) != expected) {
            throw new GradleException('Native Eclipse paths must be quoted once')
        }
        ['--to-srg', '--to-obf'].each { flag ->
            boolean rejected = false
            try { quoteEclipseLaunchPaths('runClient.launch', sample + " ${flag} obsolete") }
            catch (GradleException expectedFailure) { rejected = true }
            if (!rejected) throw new GradleException("Accepted obsolete remapping flag ${flag}")
        }
        def assets = nativeEclipseAssets()
        String resolved = resolveEclipseClientAssets('--assetsDir {assets_root} --assetIndex {asset_index}')
        if (resolved != "--assetsDir \"${assets.root}\" --assetIndex ${assets.id}"
                || resolved.contains('{asset_index}') || resolved.contains('{assets_root}')) {
            throw new GradleException('Native client assets must resolve to literal arguments')
        }
        logger.lifecycle("Verified native Eclipse assets ${assets.id} SHA-1 ${assets.sha1}; metadata generation downloaded no assets")
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Normalizes ForgeGradle Eclipse launches for production-only execution.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('configureEclipseBuildship')
    dependsOn prepareEclipseResources
    doLast {
        obsoleteForgeGradle2EclipseLaunches.each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile()) {
                String contents = launch.getText('UTF-8')
                String obsoleteMainType =
                        "org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\""
                if (contents.contains(obsoleteMainType) && !launch.delete()) {
                    throw new GradleException("Could not remove obsolete ForgeGradle 2 launch ${name}")
                }
            }
        }
        // ForgeGradle's legacy launch generator can leave this token unresolved,
        // so write the target version into every generated launch explicitly.
        def parser = new groovy.xml.XmlParser()
        fileTree(project.projectDir) {
            include 'run*.launch'
        }.files.each { File launch ->
            String contents = launch.getText('UTF-8')
            contents = contents.replace(
                    'key="MC_VERSION" value="${MC_VERSION}"',
                    "key=\"MC_VERSION\" value=\"${project.minecraft_version}\"")
            def launchXml = parser.parseText(contents)
            launchXml.stringAttribute.findAll { it.@key == 'org.eclipse.jdt.launching.PROJECT_ATTR' }.each {
                it.@value = project.name
            }
            // A reused launch may still name the old workspace project.
            launchXml.listAttribute.find { it.@key == 'org.eclipse.jdt.launching.CLASSPATH' }
                    ?.listEntry?.each { entry ->
                def runtime = parser.parseText(entry.@value)
                if (runtime.@projectName == 'baseElectric') {
                    runtime.@projectName = project.name
                    entry.@value = groovy.xml.XmlUtil.serialize(runtime)
                }
            }
            if (launch.name in ['runClient.launch', 'runServer.launch', 'runData.launch']) {
                // Eclipse compiles into bin/main, not Gradle's merged run output.
                def modClasses = launchXml.mapAttribute.find {
                    it.@key == 'org.eclipse.debug.core.environmentVariables'
                }.mapEntry.findAll { it.@key == 'MOD_CLASSES' }
                if (modClasses.size() != 1) {
                    throw new GradleException("${launch.name} must define one MOD_CLASSES entry")
                }
                String mainOutput = file('bin/main').absolutePath
                String eclipseModClasses = "${project.mod_id}%%${mainOutput}" +
                        "${File.pathSeparator}${project.mod_id}%%${mainOutput}"
                modClasses[0].@value = eclipseModClasses
                def vmArguments = launchXml.stringAttribute.find { it.@key == 'org.eclipse.jdt.launching.VM_ARGUMENTS' }
                if (vmArguments != null) {
                    // ForgeGradle leaves these path arguments bare even when a directory contains spaces.
                    vmArguments.@value = (vmArguments.@value as String)
                            .replaceAll(/(?<!\S)(-DlegacyClassPath\.file=[^"].*?)(?=\s+-[A-Za-z]|$)/) { full, argument ->
                                "\"${argument}\""
                            }
                            .replaceAll(/(?<!\S)-p\s+([^"\s].*?)(?=\s+--add-modules\b)/) { full, argument ->
                                "-p \"${argument}\""
                            }
                }
                def programArguments = launchXml.stringAttribute.find {
                    it.@key == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS'
                }
                if (programArguments == null) {
                    throw new GradleException("${launch.name} is missing its program arguments")
                }
                programArguments.@value = quoteEclipseLaunchPaths(launch.name, programArguments.@value)
                if (launch.name == 'runClient.launch') {
                    programArguments.@value = resolveEclipseClientAssets(programArguments.@value)
                }
            }
            launch.setText(groovy.xml.XmlUtil.serialize(launchXml).replace('\r\n', '\n'), 'UTF-8')
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                String marker = '</launchConfiguration>'
                String attribute =
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                contents = contents.replace(marker, attribute + '\n' + marker)
            }

            // Buildship exposes compileOnly dependencies through its project
            // container. Replace that container in production launches with
            // Gradle's runtime classpath while retaining required basePower.
            Set<File> mainOutputs = sourceSets.main.output.files.collect {
                it.canonicalFile
            } as Set<File>
            List<File> productionRuntime = configurations.runtimeClasspath.files.collect {
                it.canonicalFile
            }.findAll { File runtimeFile ->
                !mainOutputs.contains(runtimeFile)
            }
            def launchXml = parser.parseText(contents)
            def classpath = launchXml.listAttribute.find { it.@key == 'org.eclipse.jdt.launching.CLASSPATH' }
            if (classpath == null) {
                throw new GradleException("${name} is missing its explicit classpath")
            }
            // Refresh can reuse an isolated launch; replace stale runtime archives but keep Slime Launcher.
            def previousRuntime = classpath.listEntry.findAll { entry ->
                def runtime = parser.parseText(entry.@value)
                String archive = runtime.@externalArchive
                runtime.@containerPath == 'org.eclipse.buildship.core.gradleclasspathcontainer'
                        || (archive && !file(archive).name.startsWith('slime-launcher-'))
            }
            if (previousRuntime.isEmpty()) {
                throw new GradleException("${name} is missing its production runtime entries")
            }
            int runtimeIndex = classpath.children().indexOf(previousRuntime.first())
            previousRuntime.each { classpath.remove(it) }
            def runtimeEntries = productionRuntime.collect { File runtimeFile ->
                def archive = new Node(null, 'runtimeClasspathEntry',
                        [externalArchive: runtimeFile.path, type: '2', path: '5'])
                new Node(null, 'listEntry', [value: groovy.xml.XmlUtil.serialize(archive)])
            }
            classpath.children().addAll(runtimeIndex, runtimeEntries)
            launch.setText(groovy.xml.XmlUtil.serialize(launchXml).replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

def verifyJavaPackages = { Iterable<File> roots ->
    roots.findAll { it.isDirectory() }.each { root ->
        fileTree(root).matching { include '**/*.java' }.each { source ->
            def declaration = source.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)\s*;/
            if (!declaration.find()) {
                throw new GradleException("No Java package declared in ${relativePath(source)}")
            }
            String declared = declaration.group(1)
            String expected = root.toPath().relativize(source.parentFile.toPath()).join('.')
            if (declared != expected) {
                throw new GradleException("${relativePath(source)} declares ${declared}, " +
                        "but source root ${relativePath(root)} expects '${expected}'.")
            }
        }
    }
}

tasks.register('verifyJavaSourceLayout') {
    group = 'verification'
    description = 'Checks package paths that Eclipse must resolve through each Java source root.'
    doLast {
        verifyJavaPackages(sourceSets.collectMany { it.java.srcDirs }.unique())
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies the generated Eclipse project and production launches.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        preferencesFile.withInputStream { preferences.load(it) }
        if (preferences.getProperty('connection.gradle.distribution') != 'GRADLE_DISTRIBUTION(WRAPPER)'
                || file(preferences.getProperty('connection.gradle.user.home', '')).canonicalFile
                != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException('Eclipse Buildship does not use this wrapper and Gradle home')
        }
        File javaHome = javaToolchains.compilerFor(java.toolchain).get().metadata.installationPath.asFile
        if (file(preferences.getProperty('connection.java.home', '')).canonicalFile != javaHome.canonicalFile) {
            throw new GradleException('Eclipse Buildship must use the pinned Java 25 installation')
        }
        def eclipseProject = new groovy.xml.XmlSlurper().parse(file('.project'))
        if (project.name != 'ElectricAdvantage' || eclipseProject.name.text() != project.name) {
            throw new GradleException('The Eclipse and Gradle project names must both be ElectricAdvantage')
        }
        if (!eclipseProject.natures.nature.any { it.text() == 'org.eclipse.buildship.core.gradleprojectnature' }
                || !eclipseProject.buildSpec.buildCommand.name.any { it.text() == 'org.eclipse.buildship.core.gradleprojectbuilder' }) {
            throw new GradleException('Eclipse project metadata is missing its Buildship nature or builder')
        }
        ['Client', 'Server', 'Data', 'TestClient', 'TestServer', 'TestData'].each { run ->
            String name = "run${run}.launch"
            def launch = new groovy.xml.XmlSlurper().parse(file(name))
            def projectAttributes = launch.stringAttribute.findAll {
                it.@key.text() == 'org.eclipse.jdt.launching.PROJECT_ATTR'
            }.collect { it.@value.text() }
            def classpathProjects = launch.listAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.CLASSPATH'
            }.listEntry.collect {
                new groovy.xml.XmlSlurper().parseText(it.@value.text()).@projectName.text()
            }.findAll { it }
            if (projectAttributes != [project.name] || classpathProjects != [project.name]) {
                throw new GradleException("${name} must use the ${project.name} Eclipse project and classpath entry")
            }
        }
        File eclipseModMetadata = file('bin/main/META-INF/mods.toml')
        String eclipseMetadata = eclipseModMetadata.getText('UTF-8')
        if (!eclipseMetadata.contains("modId=\"${project.mod_id}\"")
                || !eclipseMetadata.contains("version=\"${project.mod_version}\"")) {
            throw new GradleException('Eclipse output contains incorrect mod metadata')
        }
        def eclipseClasspath = new groovy.xml.XmlSlurper().parse(file('.classpath'))
        def eclipseSourceRoots = eclipseClasspath.classpathentry.findAll {
            it.@kind.text() == 'src' && !it.@path.text().startsWith('/')
        }.collect { file(it.@path.text()).canonicalFile }
        def expectedJavaRoots = sourceSets.collectMany { it.java.srcDirs }
                .findAll { it.isDirectory() }.collect { it.canonicalFile }
        if (!eclipseSourceRoots.containsAll(expectedJavaRoots)) {
            throw new GradleException('Eclipse classpath omits a configured Java source root')
        }
        verifyJavaPackages(eclipseSourceRoots)
        def productionJre = eclipseClasspath.classpathentry.findAll {
            it.@kind.text() == 'con' && it.@path.text().startsWith('org.eclipse.jdt.launching.JRE_CONTAINER/')
        }
        if (productionJre.size() != 1 || productionJre[0].@path.text().tokenize('/').last() != 'JavaSE-25') {
            throw new GradleException('Eclipse production JRE must be JavaSE-25')
        }
        def processedResources = eclipseClasspath.classpathentry.findAll {
            it.@kind.text() == 'src' && it.@path.text() == 'build/resources/main'
        }
        def rawResourcePaths = sourceSets.main.resources.srcDirs.collect { relativePath(it).replace('\\', '/') }
        if (processedResources.size() != 1 || processedResources[0].@output.text() != 'bin/main'
                || eclipseClasspath.classpathentry.any {
                    it.@kind.text() == 'src' && rawResourcePaths.contains(it.@path.text())
                }) {
            throw new GradleException('Eclipse must copy processed resources, never raw mod metadata templates')
        }
        String mainOutput = eclipseClasspath.classpathentry.find {
            it.@kind.text() == 'src' && it.@path.text() == 'src/main/java'
        }.@output.text()
        if (file(mainOutput).canonicalFile != file('bin/main').canonicalFile) {
            throw new GradleException('Eclipse production classes must use bin/main')
        }
        String expectedModClasses = "${project.mod_id}%%${file(mainOutput).absolutePath}" +
                "${File.pathSeparator}${project.mod_id}%%${file(mainOutput).absolutePath}"
        ['runClient.launch', 'runServer.launch', 'runData.launch'].each { name ->
            def launch = new groovy.xml.XmlSlurper().parse(file(name))
            String modClasses = launch.mapAttribute.find {
                it.@key.text() == 'org.eclipse.debug.core.environmentVariables'
            }.mapEntry.find { it.@key.text() == 'MOD_CLASSES' }.@value.text()
            if (modClasses != expectedModClasses) {
                throw new GradleException("${name} does not discover the Eclipse production mod in bin/main")
            }
            String programArguments = launch.stringAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS'
            }.@value.text()
            if (quoteEclipseLaunchPaths(name, programArguments) != programArguments) {
                throw new GradleException("${name} has an unquoted path argument")
            }
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            def launch = new groovy.xml.XmlSlurper().parse(file(name))
            String contents = file(name).getText('UTF-8').replace('\\', '/')
            if (launch.booleanAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE'
            }.@value.text() != 'true'
                    || contents.contains('src/test') || contents.contains('bin/test')
                    || contents.contains('generated-unit-support') || contents.contains('forge-native-unit-bootstrap')) {
                throw new GradleException("${name} does not isolate production code")
            }
            def runtimeEntries = launch.listAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.CLASSPATH'
            }.listEntry.collect { new groovy.xml.XmlSlurper().parseText(it.@value.text()) }
            if (runtimeEntries.any { it.@containerPath.text() == 'org.eclipse.buildship.core.gradleclasspathcontainer' }) {
                throw new GradleException("${name} exposes compileOnly dependencies at runtime")
            }
            List<File> runtimeArchives = runtimeEntries.findAll { it.@externalArchive.text() }.collect {
                file(it.@externalArchive.text()).canonicalFile
            }
            ['RF-API.jar', 'RebornCore-1.12.2'].each { forbiddenDependency ->
                if (contents.toLowerCase(Locale.ROOT).contains(forbiddenDependency.toLowerCase(Locale.ROOT))) {
                    throw new GradleException(
                            "${name} includes forbidden runtime dependency ${forbiddenDependency}")
                }
            }
            if (!runtimeArchives.contains(powerAdvantageDeobfJar.get().canonicalFile)) {
                throw new GradleException("${name} is missing the required basePower runtime")
            }
            if (!runtimeArchives.contains(baseMetalsDeobfJar.get().canonicalFile)
                    || !runtimeArchives.contains(oreSpawnDeobfJar.get().canonicalFile)) {
                throw new GradleException("${name} is missing the required Base Metals or OreSpawn runtime")
            }
            List<String> bootstrapArtifacts = [
                    "forge-${project.minecraft_version}-${project.forge_version}",
                    "client-extra-${project.minecraft_version}"
            ]
            List<Integer> bootstrapPositions = bootstrapArtifacts.collect { artifact ->
                runtimeArchives.findIndexOf { it.name.contains(artifact) }
            }
            if (runtimeArchives.any { it.name.startsWith('mappings_') }
                    || bootstrapPositions.any { it < 0 }
                    || bootstrapPositions != bootstrapPositions.sort(false)) {
                throw new GradleException(
                        "${name} does not preserve the Forge bootstrap classpath order")
            }
            String programArguments = launch.stringAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS'
            }.@value.text()
            String vmArguments = launch.stringAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.VM_ARGUMENTS'
            }.@value.text()
            String mainType = launch.stringAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.MAIN_TYPE'
            }.@value.text()
            String target = name == 'runClient.launch' ? 'forge_userdev_client' : 'forge_userdev_server'
            if (programArguments.contains('--to-srg') || programArguments.contains('--to-obf')
                    || programArguments.contains('{asset_index}') || programArguments.contains('{assets_root}')
                    || !contents.contains('StandardVMType/JavaSE-25')) {
                throw new GradleException("${name} has obsolete mappings, unresolved assets or the wrong Java runtime")
            }
            if (contents.contains('${MC_VERSION}')
                    || mainType != 'net.minecraftforge.launcher.Main'
                    || !programArguments.startsWith('--main net.minecraftforge.bootstrap.ForgeBootstrap ')
                    || !(programArguments =~ /(?:^|\s)--launchTarget\s+${target}(?:\s|$)/).find()
                    || !vmArguments.contains('--add-opens java.base/java.lang.invoke=ALL-UNNAMED')) {
                throw new GradleException("${name} does not define the Forge 64 bootstrap and native launch target")
            }
            ['--cache', '--metadata'].each { option ->
                def argument = programArguments =~ /(?:^|\s)${option}\s+(?:"([^"]+)"|([^"\s]+))(?=\s+--|$)/
                if (!argument.find()) {
                    throw new GradleException("${name} must keep ${option} as one Slime Launcher argument")
                }
                File path = file(argument.group(1) ?: argument.group(2))
                if (option != '--cache' && !path.isFile()) {
                    throw new GradleException("${name} ${option} points to a missing file: ${path}")
                }
            }
        }
    }
}

tasks.register('verifyModelAssets') {
    group = 'verification'
    description = 'Verifies baseElectric JSON and model references against packaged assets.'
    dependsOn tasks.named('verifyReleaseDependencies')
    File resourceRoot = file('src/main/resources')
    File assetRoot = new File(resourceRoot, "assets/${project.mod_id}")
    File modelRoot = new File(assetRoot, 'models')
    File blockstateRoot = new File(assetRoot, 'blockstates')
    File atlasFile = new File(resourceRoot, blocksAtlasPath)
    inputs.dir(assetRoot)
    inputs.dir(new File(resourceRoot, 'data'))
    inputs.files(atlasFile)
    inputs.file(new File(resourceRoot, 'assets/minecraft/atlases/items.json'))
    inputs.file(powerAdvantageDeobfJar)

    doLast {
        fileTree(assetRoot) { include '**/*.json' }.files.sort().each { File jsonFile ->
            new JsonSlurper().parse(jsonFile)
        }
        fileTree(new File(resourceRoot, 'data')) { include '**/*.json' }.files.sort().each { File jsonFile ->
            new JsonSlurper().parse(jsonFile)
        }

        Set<String> registeredSprites = [] as Set<String>
        [blocksAtlasPath, itemsAtlasPath].each { path ->
            validateOwnedAtlas(new JsonSlurper().parse(new File(resourceRoot, path)), project.mod_id,
                    registeredSprites, { resource -> new File(resourceRoot, resource).isFile() }, path)
        }
        if (registeredSprites.contains('baseelectric:materials/laser_beam')
                || !registeredSprites.contains('baseelectric:entity/laser_turret')
                || !registeredSprites.contains('baseelectric:materials/machine_case')) {
            throw new GradleException('Electric atlas is missing a required sprite or includes the direct-render beam')
        }
        Set<String> powerAdvantageAssets = new ZipFile(powerAdvantageDeobfJar.get()).withCloseable { zip ->
            [blocksAtlasPath, itemsAtlasPath].each { path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Pinned basePower is missing ${path}")
                zip.getInputStream(entry).withCloseable { input ->
                    validateOwnedAtlas(new JsonSlurper().parse(input, 'UTF-8'), 'basepower', registeredSprites,
                            { resource -> zip.getEntry(resource) != null }, 'Pinned Power ' + path)
                }
            }
            zip.entries().collect { it.name } as Set<String>
        }
        Set<String> vanillaAssets = [] as Set<String>
        sourceSets.main.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { archive ->
            new ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name.startsWith('assets/minecraft/')) vanillaAssets.add(entry.name)
                }
            }
        }
        def verifyReference = { String reference, String assetType, String sourcePath ->
            if (reference.startsWith('#')) return
            int separator = reference.indexOf(':')
            String namespace = separator >= 0 ? reference.substring(0, separator) : 'minecraft'
            String path = separator >= 0 ? reference.substring(separator + 1) : reference
            if (namespace == 'minecraft') {
                if (assetType == 'models' && path.startsWith('builtin/')) return
                String suffix = assetType == 'textures' ? '.png' : '.json'
                if (!vanillaAssets.contains("assets/minecraft/${assetType}/${path}${suffix}".toString())) {
                    throw new GradleException("${sourcePath} references missing vanilla ${assetType} asset ${reference}")
                }
                return
            }
            if (namespace != project.mod_id && namespace != 'basepower') return

            String suffix = assetType == 'textures' ? '.png' : '.json'
            String targetPath = "assets/${namespace}/${assetType}/${path}${suffix}"
            boolean present = namespace == project.mod_id
                    ? new File(resourceRoot, targetPath).isFile()
                    : powerAdvantageAssets.contains(targetPath)
            if (!present) {
                throw new GradleException(
                        "${sourcePath} references missing ${assetType} asset ${reference}")
            }
            if (assetType == 'textures' && !registeredSprites.contains(reference)) {
                throw new GradleException("${sourcePath} references an unregistered native sprite ${reference}")
            }
        }

        fileTree(modelRoot) { include '**/*.json' }.files.sort().each { File modelFile ->
            def model = new JsonSlurper().parse(modelFile)
            if (model.parent instanceof String) {
                verifyReference(model.parent, 'models', modelFile.path)
            }
            if (model.textures instanceof Map) {
                model.textures.values().findAll { it instanceof String }.each { String texture ->
                    verifyReference(texture, 'textures', modelFile.path)
                }
            }
            if (model.elements instanceof List) {
                model.elements.each { element ->
                    if (element.faces instanceof Map) {
                        element.faces.values().each { face ->
                            if (face.texture instanceof String) verifyReference(face.texture, 'textures', modelFile.path)
                        }
                    }
                }
            }
        }
        Closure verifyBlockstateModels
        verifyBlockstateModels = { Object node, String sourcePath ->
            if (node instanceof Map) {
                node.each { key, value ->
                    if (key == 'model' && value instanceof String) {
                        verifyReference(value, 'models', sourcePath)
                    } else {
                        verifyBlockstateModels(value, sourcePath)
                    }
                }
            } else if (node instanceof Collection) {
                node.each { verifyBlockstateModels(it, sourcePath) }
            }
        }
        fileTree(blockstateRoot) { include '**/*.json' }.files.sort().each { File blockstateFile ->
            def blockstate = new JsonSlurper().parse(blockstateFile)
            if (blockstate.containsKey('forge_marker') || (blockstate.variants instanceof Map
                    && (blockstate.variants.containsKey('normal') || blockstate.variants.containsKey('fluid')))) {
                throw new GradleException("${blockstateFile.path} uses removed legacy blockstate selectors")
            }
            verifyBlockstateModels(blockstate, blockstateFile.path)
        }
    }
}

tasks.register('verifyRepositoryHygiene') {
    group = 'verification'
    description = 'Rejects tracked agent context, IDE state, dependencies, and generated output.'
    doLast {
        if (!file('.git').exists()) {
            throw new GradleException('Repository hygiene verification requires a Git checkout')
        }
        List<String> tracked = providers.exec {
            commandLine 'git', 'ls-files'
        }.standardOutput.asText.get().readLines()
        List<String> forbidden = tracked.findAll { path ->
            String normalized = path.replace('\\', '/').toLowerCase(Locale.ROOT)
            String name = normalized.tokenize('/').last()
            normalized.startsWith('agent-notes/')
                    || normalized.startsWith('.agent/')
                    || normalized.startsWith('.agents/')
                    || normalized.startsWith('.codex/')
                    || normalized.startsWith('.claude/')
                    || normalized.startsWith('.cursor/')
                    || normalized.startsWith('.ci-dependencies/')
                    || normalized.startsWith('.settings/')
                    || normalized.startsWith('.gradle-user-home/')
                    || normalized.startsWith('build/')
                    || normalized.startsWith('bin/')
                    || normalized.startsWith('run/')
                    || name == 'agent.md'
                    || name == 'agents.md'
                    || name == 'claude.md'
                    || name == '.classpath'
                    || name == '.project'
                    || name.endsWith('.launch')
                    || name.startsWith('agent-')
                    || name.startsWith('codex-')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Generated or local files are tracked: ${forbidden}")
        }
    }
}

tasks.register('verifyRecipeTagGuards') {
    group = 'verification'
    description = 'Rejects recipes that can collapse when a Forge material tag is empty.'
    File recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
    inputs.dir(recipeRoot)
    doLast {
        Closure collectTags
        collectTags = { Object node, Set<String> tags ->
            if (node instanceof Map) {
                node.each { key, value ->
                    if (key == 'forge:condition' || key == 'result') return
                    if (key == 'tag' && value instanceof String && value.startsWith('forge:')) {
                        tags.add(value)
                    } else {
                        collectTags(value, tags)
                    }
                }
            } else if (node instanceof Collection) {
                node.each { collectTags(it, tags) }
            } else if (node instanceof String && node.startsWith('#forge:')) {
                tags.add(node.substring(1))
            }
        }
        fileTree(recipeRoot) { include '**/*.json' }.files.sort().each { File recipeFile ->
            Map recipe = new JsonSlurper().parse(recipeFile) as Map
            Set<String> tags = [] as Set<String>
            collectTags(recipe, tags)
            Map condition = recipe['forge:condition'] as Map
            Collection conditions = condition == null ? [] :
                    condition.type == 'forge:and' ? condition.values : [condition]
            if (conditions.any { !(it instanceof Map) }) {
                throw new GradleException("${recipeFile.path} contains a non-object recipe condition")
            }
            if (conditions.any { it.type == 'forge:tag_empty'
                    || (it.type == 'forge:not' && it.value?.type == 'forge:tag_empty') }) {
                throw new GradleException("${recipeFile.path} must use Power's content-aware tag conditions")
            }
            Set<String> guards = conditions
                    .findAll { it.type == 'basepower:tag_not_empty' }
                    .collect { it.tag as String } as Set<String>
            Set<String> emptyGuards = conditions.findAll { it.type == 'basepower:tag_empty' }
                    .collect { it.tag as String } as Set<String>
            if (!(emptyGuards.intersect(guards)).isEmpty()) {
                throw new GradleException("${recipeFile.path} requires the same tag to be empty and nonempty")
            }
            Set<String> missing = tags - guards
            if (!missing.isEmpty()) {
                throw new GradleException("${recipeFile.path} lacks tag_not_empty guards for ${missing.sort()}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyEclipseLaunchArguments')
    dependsOn tasks.named('compileGameTestValidationJava'), tasks.named('compileClientValidationJava')
    dependsOn tasks.named('verifyJavaSourceLayout')
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyModelAssets')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyRecipeTagGuards')
}
