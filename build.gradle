import java.security.MessageDigest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

apply from: 'gradle/verify-eclipse-ecj.gradle'

group = project.mod_group
version = project.mod_version
base.archivesName = 'baseElectric'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextPatterns = ['**/*.json', '**/*.toml', '**/*.mcmeta', '**/*.cfg',
        '**/*.properties', '**/*.js', '**/*.txt', '**/*.md']

tasks.named('sourcesJar', Jar) {
    inputs.property('canonicalTextLineEndings', 'lf')
    filesMatching(['**/*.java', '**/*.json', '**/*.toml', '**/*.cfg', '**/*.properties', '**/*.mcmeta', '**/*.js']) {
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
    }
}

sourceSets {
    main.resources.srcDir 'src/generated/resources'
    gameTestValidation {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/modresources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestValidationImplementation.extendsFrom implementation
    gameTestValidationRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gameTestValidation)
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTestValidation
            gameDirectory = file(providers.gradleProperty('electricGameTestRunDirectory')
                    .getOrElse('build/port-evidence/game-test-run'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll(['--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath])
        }
    }
    mods {
        baseelectric { sourceSet sourceSets.main }
        baseelectric_tests { sourceSet sourceSets.gameTestValidation }
    }
}

neoForge.runs.configureEach {
    loadedMods = name == 'gameTestServer' ? [neoForge.mods.baseelectric, neoForge.mods.baseelectric_tests]
            : [neoForge.mods.baseelectric]
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.moddev.zone/releases' }
}

def powerJar = file(providers.gradleProperty('powerAdvantageJar')
        .orElse(providers.gradleProperty('powerAdvantageDeobfJar'))
        .getOrElse("../../PowerAdvantage/build/libs/basePower-${project.poweradvantage_version}.jar"))
def baseMetalsJar = providers.gradleProperty('baseMetalsJar')
dependencies {
    implementation files(powerJar)
    if (providers.gradleProperty('mmdlibJar').isPresent()) {
        implementation files(providers.gradleProperty('mmdlibJar').get())
    } else {
        implementation "zone.moddev.mc.lib:mmdlib:${project.mmdlib_version}"
    }
    if (baseMetalsJar.isPresent()) {
        runtimeOnly files(baseMetalsJar.get())
    } else {
        runtimeOnly "zone.moddev.mc.basemetals:BaseMetals:${project.basemetals_version}"
    }
    if (providers.gradleProperty('oreSpawnJar').isPresent()) {
        implementation files(providers.gradleProperty('oreSpawnJar').get())
    } else {
        implementation "zone.moddev.mc.orespawn:OreSpawn:${project.orespawn_version}"
    }
    testImplementation 'junit:junit:4.13.2'
}

def resourceClasses = layout.buildDirectory.dir('classes/resource-validation')
tasks.register('compileNativeResourceChecks', JavaCompile) {
    dependsOn 'createMinecraftArtifacts'
    source fileTree('src/test/java/zone/moddev/mc/baseelectric/resources') { include '**/*.java' }
    source 'src/test/java/zone/moddev/mc/baseelectric/verification/NativeTestBootstrap.java'
    classpath = files(providers.provider { sourceSets.test.compileClasspath.files.findAll {
        !it.toPath().startsWith(layout.buildDirectory.dir('classes').get().asFile.toPath())
                && !it.toPath().startsWith(layout.buildDirectory.dir('resources').get().asFile.toPath())
    } })
    destinationDirectory = resourceClasses
}
tasks.register('nativeResourceChecks', Test) {
    dependsOn 'compileNativeResourceChecks', 'processResources'
    testClassesDirs = files(resourceClasses)
    classpath = files(resourceClasses, providers.provider { sourceSets.test.runtimeClasspath.files.findAll {
        !it.toPath().startsWith(layout.buildDirectory.dir('classes').get().asFile.toPath())
                && !it.toPath().startsWith(layout.buildDirectory.dir('resources').get().asFile.toPath())
    } })
}

tasks.named('processResources', ProcessResources) {
    def replacements = [version: project.version, minecraft_version_range: project.minecraft_version_range,
            neo_version_range: project.neo_version_range, loader_version_range: project.loader_version_range,
            poweradvantage_version: project.poweradvantage_version]
    inputs.properties(replacements)
    inputs.property('canonicalResourceTextFormat', 'UTF-8-LF')
    inputs.property('archiveTextPatterns', archiveTextPatterns)
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
    filesMatching(archiveTextPatterns) {
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'),
                eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'), fixlast: false)
    }
}
tasks.named('jar', Jar) {
    manifest.attributes('Specification-Title': project.mod_id,
            'Specification-Vendor': project.mod_authors, 'Specification-Version': '2',
            'Implementation-Title': 'baseElectric', 'Implementation-Version': project.version,
            'Implementation-Vendor': project.mod_authors,
            'Built-On': "${project.minecraft_version}-NeoForge-${project.neo_version}")
}

def structures = layout.buildDirectory.dir('generated-electric-gametest')
tasks.register('encodeElectricGameTestStructure', JavaExec) {
    dependsOn tasks.named('compileGameTestValidationJava')
    classpath = files(providers.provider { sourceSets.gameTestValidation.runtimeClasspath.files.findAll {
        it != sourceSets.gameTestValidation.output.resourcesDir
    } })
    mainClass = 'zone.moddev.mc.baseelectric.gametest.ElectricGameTests'
    def target = structures.map { it.file('data/baseelectric/structure/empty.nbt') }
    inputs.file('src/gametest/resources/gameteststructures/empty.snbt')
    outputs.file(target)
    args file('src/gametest/resources/gameteststructures/empty.snbt').absolutePath,
            target.get().asFile.absolutePath
}
sourceSets.gameTestValidation.resources.srcDir structures
tasks.named('processGameTestValidationResources') { dependsOn 'encodeElectricGameTestStructure' }

tasks.register('prepareElectricGameTestFixture') {
    doLast {
        File directory = file(providers.gradleProperty('electricGameTestRunDirectory')
                .getOrElse('build/port-evidence/game-test-run')).canonicalFile
        File evidence = layout.buildDirectory.dir('port-evidence').get().asFile.canonicalFile
        if (!directory.toPath().startsWith(evidence.toPath()) || directory.exists()) {
            throw new GradleException('Use a new GameTest directory inside build/port-evidence')
        }
        String eula = providers.gradleProperty('electricGameTestEula').getOrElse('')
        if (!eula || !file(eula).isFile() || !(file(eula).text =~ /(?m)^eula=true\s*$/).find()) {
            throw new GradleException('Supply an existing accepted EULA with -PelectricGameTestEula=<path>')
        }
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\n'
        String recipeMode = providers.gradleProperty('electricGameTestRecipeMode').getOrElse('NORMAL')
        if (!(recipeMode in ['NORMAL', 'TECH_PROGRESSION', 'APOCALYPTIC'])) {
            throw new GradleException('Unknown GameTest recipe mode: ' + recipeMode)
        }
        File config = new File(directory, 'config')
        config.mkdirs()
        new File(config, 'basepower-common.toml').text = '[options]\nrecipeMode="' + recipeMode + '"\n'
    }
}
tasks.named('runGameTestServer') {
    dependsOn 'prepareElectricGameTestFixture'
    doLast {
        File directory = file(providers.gradleProperty('electricGameTestRunDirectory')
                .getOrElse('build/port-evidence/game-test-run'))
        File nativeLog = new File(directory, 'logs/latest.log')
        String receipt = nativeLog.isFile() ? nativeLog.getText('UTF-8') : ''
        if (!receipt.contains('ELECTRIC_GAMETEST_LOADED_MODS {')
                || !receipt.contains('All 7 required tests passed')) {
            throw new GradleException('Missing successful in-process native loaded-mod/test receipt: ' + nativeLog)
        }
    }
}

tasks.register('verifyReleaseConfiguration') {
    doLast {
        if (project.mod_version != '2.2.20.121012' || project.loader_name != 'neoforge'
                || project.neo_version != '21.1.265' || project.minecraft_version != '1.21.1') {
            throw new GradleException('Unexpected NeoForge 1.21.1 candidate configuration')
        }
        if (!powerJar.isFile()) throw new GradleException("Build coordinated basePower first: ${powerJar}")
        if (!(project.release_player_sha256 ==~ /[A-F0-9]{64}/)) {
            throw new GradleException('Missing approved release_player_sha256')
        }
    }
}
tasks.register('verifyReleaseArtifacts') {
    dependsOn 'jar', 'sourcesJar', 'javadocJar', 'verifyReleaseConfiguration'
    doLast {
        new ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            if (!zip.getEntry('META-INF/neoforge.mods.toml')) throw new GradleException('Missing NeoForge metadata')
            if (zip.getEntry('META-INF/mods.toml')) throw new GradleException('Forge metadata in NeoForge artifact')
            zip.entries().each { entry ->
                if (entry.name.startsWith('net/') || entry.name.startsWith('cyano/')
                        || entry.name.startsWith('zone/moddev/mc/basepower/')
                        || entry.name.contains('gametest/')) {
                    throw new GradleException("Bundled dependency or tests: ${entry.name}")
                }
            }
        }
        String actual = MessageDigest.getInstance('SHA-256').digest(tasks.jar.archiveFile.get().asFile.bytes)
                .encodeHex().toString().toUpperCase(Locale.ROOT)
        if (actual != project.release_player_sha256) {
            throw new GradleException('Player artifact differs from approved release_player_sha256: ' + actual)
        }
    }
}
tasks.register('writeReleaseChecksums') {
    dependsOn 'verifyReleaseArtifacts'
    doLast {
        def output = layout.buildDirectory.file('libs/SHA256SUMS.txt').get().asFile
        String checksums = tasks.withType(Jar).findAll { it.name in ['jar', 'sourcesJar', 'javadocJar'] }
                .collect { it.archiveFile.get().asFile }.sort { it.name }.collect {
                    MessageDigest.getInstance('SHA-256').digest(it.bytes).encodeHex().toString().toUpperCase() +
                            '  ' + it.name
                }.join('\n') + '\n'
        output.text = checksums
        def dispatcher = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        dispatcher.parentFile.mkdirs()
        dispatcher.text = checksums
    }
}
tasks.register('verifyRepositoryHygiene') {
    doLast {
        def paths = providers.exec { commandLine 'git', 'ls-files' }.standardOutput.asText.get().readLines()
        def forbidden = paths.findAll { it ==~ /(?i)(.*\/)?(AGENTS\.md|AGENT\.md|agent-.*|codex-.*)/
                || it.startsWith('build/') || it.startsWith('bin/') || it.endsWith('.launch') }
        if (forbidden) throw new GradleException("Tracked generated or agent files: ${forbidden}")
    }
}
tasks.named('check') { dependsOn 'verifyRepositoryHygiene', 'verifyReleaseConfiguration' }

eclipse {
    project {
        name = 'ElectricAdvantage'
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { model ->
            // Buildship merges the existing .classpath on every refresh.
            model.entries.removeAll { it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                    && it.path in ['src/main/resources', 'src/generated/resources', 'build/resources/main'] }
            model.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder('build/resources/main', 'bin/main'))
            model.entries.findAll { it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                    && it.path.startsWith('src/gametest/') }.each { it.entryAttributes['test'] = 'true' }
        }
    }
}
tasks.named('eclipseClasspath') { dependsOn 'processResources' }
tasks.register('prepareEclipseResources', Copy) {
    dependsOn 'processResources'
    from layout.buildDirectory.dir('resources/main')
    into 'bin/main'
}
tasks.named('eclipse') { dependsOn 'prepareEclipseResources' }
tasks.register('verifyEclipseProductionClasspath') {
    dependsOn 'eclipse'
    doLast {
        def model = new groovy.xml.XmlSlurper().parse(file('.classpath'))
        if (!model.classpathentry.any { it.@path == 'build/resources/main' && it.@output == 'bin/main' }
                || model.classpathentry.any { it.@path == 'src/main/resources' }) {
            throw new GradleException('Eclipse must consume expanded production metadata')
        }
        String metadata = file('bin/main/META-INF/neoforge.mods.toml').text
        if (!metadata.contains('version="' + project.mod_version + '"') || metadata.contains('${')) {
            throw new GradleException('Eclipse NeoForge metadata was not expanded')
        }
        if (!model.classpathentry.any { it.@path.text().contains('JavaSE-21') }) {
            throw new GradleException('Eclipse must use Java 21')
        }
    }
}
neoForge.ideSyncTask tasks.named('processResources')

publishing {
    publications { mavenJava(MavenPublication) { from components.java; artifactId = 'baseElectric' } }
}
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst { throw new GradleException('This local port candidate is not authorized for publication') }
}

apply from: 'gradle/verify-native-inputs.gradle'
apply from: 'gradle/reproducible-docs.gradle'
