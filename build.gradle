tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates release identity, target metadata, and dependency policy.'
    doLast {
        def pack = new JsonSlurper().parse(file('src/main/resources/pack.mcmeta')).pack
        if (pack.pack_format != 9 || pack['forge:resource_pack_format'] != 8 || pack['forge:data_pack_format'] != 9) {
            throw new GradleException('Minecraft 1.18.2 requires Forge resource pack format 8 and data pack format 9')
        }
        if (project.mod_version != '2.2.11.118021') {
            throw new GradleException("Unexpected baseElectric release version: ${project.mod_version}")
        }
        if (project.minecraft_version != '1.18.2'
                || project.minecraft_version_range != '[1.18.2]'
                || project.forge_version != '40.3.0'
                || project.forge_version_range != '[40.3.0,41)'
                || project.loader_version_range != '[40,)'
                || project.mapping_channel != 'official'
                || project.mapping_version != '1.18.2'
                || project.mcp_version != '20220404.173914') {
            throw new GradleException('Unexpected Minecraft, Forge, or mappings target')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '17'
                || project.java_toolchain_version != '17.0.1+12'
                || project.java_setup_version != '17.0.1+12'
                || project.gradle_java_version != '17') {
            throw new GradleException('Unexpected release dispatcher target metadata')
        }
        if (project.mod_id != 'baseelectric'
                || project.group.toString() != 'zone.moddev.mc.baseelectric'
                || project.mod_name != 'baseElectric'
                || base.archivesName.get() != 'baseElectric'
                || project.mod_license != 'GPL-3.0-only'
                || project.curseforge_project_id != '1783006') {
            throw new GradleException('Unexpected Forge, Maven, archive, or CurseForge identity')
        }
        if (project.cf_requirements != 'basepower,base-metals'
                || project.cf_optionals != ''
                || project.cf_versions != '1.18.2') {
            throw new GradleException('Unexpected CurseForge dependency or game-version metadata')
        }
        if (project.poweradvantage_version != '2.4.10.118021'
                || project.poweradvantage_source_repository != 'MinecraftModDevelopmentMods/basePower') {
            throw new GradleException('Unexpected basePower compile dependency identity')
        }
        requirePowerPin()
        if (project.basemetals_version != '3.1.2.118021'
                || project.orespawn_version != '4.1.0.118021'
                || project.basemetals_source_commit != '3488ed58403722ac3ff203cff7680dfc16e0fd3f'
                || project.basemetals_deobf_sha256 != 'E4F9E2CDE355275218C79954D3792D000615790C7CBAE5FCEC59636A8C4CA57D'
                || project.basemetals_runtime_sha256 != '5595C2CE7ADCDF1599E4327F1130121148A5CACD928CBC2190312D61F7CA37A9'
                || project.orespawn_source_commit != 'd31f52f296739f34a0c13f554abf3e1ac071ae25'
                || project.orespawn_deobf_sha256 != '34B25B2116FD91B0050C80393F8356A5CA256E707BF443E4882BE5CFAD1335B6'
                || project.orespawn_runtime_sha256 != 'BD8D84A96DAFB7668E95D61B9D72C62AEF3440675473E41244C182C64653356F'
                || project.forge_installer_sha256 != '9434C29790504DCD11CE97CB30DD8891B4B18848982357BC1B5ABFA79FB95103') {
            throw new GradleException('Unexpected native dependency pins')
        }
        String mainSource = file(
                'src/main/java/zone/moddev/mc/baseelectric/ElectricAdvantage.java').getText('UTF-8')
        if (!mainSource.contains('MODID = "baseelectric"')
                || !mainSource.contains('VERSION = "2.2.11.118021"')) {
            throw new GradleException('baseElectric source identity changed')
        }
        String metadata = file('src/main/resources/META-INF/mods.toml').getText('UTF-8').replace('\r\n', '\n')
        ['modId="baseelectric"', 'displayName="baseElectric"', 'modId="basepower"', 'modId="basemetals"',
         'versionRange="[2.4.10.118021,3.0.0)"', 'versionRange="[3.1.2.118021,4.0.0)"'].each { marker ->
            if (!metadata.contains(marker)) {
                throw new GradleException("Source mods.toml is missing ${marker}")
            }
        }
        if (!metadata.contains('modId="basemetals"\nmandatory=false')) {
            throw new GradleException('Base Metals must remain Forge-optional; CurseForge installs it for players')
        }
    }
}

def auditModInput = { File jarFile, String modId, String version, List<String> required ->
    new ZipFile(jarFile).withCloseable { zip ->
        (required + ['META-INF/MANIFEST.MF', 'META-INF/mods.toml']).each { entry ->
            if (zip.getEntry(entry) == null) throw new GradleException("${jarFile.name} is missing ${entry}")
        }
        def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
        String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
        if (manifest.getValue('Implementation-Version') != version
                || manifest.getValue('Built-On') != '1.18.2-40.3.0'
                || manifest.getValue('Built-On-Java') != '17'
                || !metadata.contains("modId=\"${modId}\"")
                || !metadata.contains("version=\"${version}\"")) {
            throw new GradleException("${jarFile.name} has unexpected ${modId} version or target metadata")
        }
        logger.lifecycle("Verified ${modId} ${version}: ${sha256Of(jarFile)}  ${jarFile}")
    }
}

tasks.register('verifyLocalNativeInputs') {
    group = 'verification'
    description = 'Verifies explicit Base Metals and OreSpawn 1.18.2 development and player JARs.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    doLast {
        auditModInput(baseMetalsDeobfJar.get(), 'basemetals', project.basemetals_version, [])
        auditModInput(pinnedFile('baseMetalsRuntimeJar', project.basemetals_runtime_sha256),
                'basemetals', project.basemetals_version, [])
        auditModInput(oreSpawnDeobfJar.get(), 'orespawn', project.orespawn_version, [])
        auditModInput(pinnedFile('oreSpawnRuntimeJar', project.orespawn_runtime_sha256),
                'orespawn', project.orespawn_version, [])
    }
}

tasks.register('verifyLocalRuntimeInputs') {
    group = 'verification'
    description = 'Audits the exact player dependency stack before a disposable packaged run.'
    dependsOn tasks.named('verifyLocalNativeInputs')
    doLast {
        requirePowerPin()
        auditModInput(pinnedFile('powerAdvantageRuntimeJar', project.poweradvantage_runtime_sha256),
                'basepower', project.poweradvantage_version, [])
        File installer = pinnedFile('forgeInstallerJar', project.forge_installer_sha256)
        logger.lifecycle("Verified Forge installer: ${project.forge_installer_sha256}  ${installer}")
    }
}

tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Resolves Forge and audits the exact required basePower development jar.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    doLast {
        File powerJar = powerAdvantageDeobfJar.get()
        File metalsJar = baseMetalsDeobfJar.get()
        File oreJar = oreSpawnDeobfJar.get()
        auditModInput(powerJar, 'basepower', project.poweradvantage_version,
            ['cyano/poweradvantage/api/PoweredEntity.class',
             'cyano/poweradvantage/api/GUIBlock.class',
             'cyano/poweradvantage/api/FluidCategoryRegistry.class',
             'cyano/poweradvantage/api/migration/LegacyMigrationApi.class',
             'zone/moddev/mc/basepower/conduitnetwork/ConduitRegistry.class',
             'zone/moddev/mc/basepower/init/Fluids.class'])
        auditModInput(metalsJar, 'basemetals', project.basemetals_version, [])
        auditModInput(oreJar, 'orespawn', project.orespawn_version, [])

        Set<File> compileFiles = configurations.compileClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!compileFiles.containsAll([powerJar.canonicalFile, metalsJar.canonicalFile, oreJar.canonicalFile])) {
            throw new GradleException('A verified development mod is missing from compileClasspath')
        }
        Set<File> runtimeFiles = configurations.runtimeClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!runtimeFiles.containsAll([powerJar.canonicalFile, metalsJar.canonicalFile, oreJar.canonicalFile])) {
            throw new GradleException('A verified development mod is missing from runtimeClasspath')
        }
        if (!compileFiles.any { it.name == "mappings_official-${project.minecraft_version}-${project.mcp_version}.zip" }) {
            throw new GradleException('The resolved Forge official mappings do not match the MCP pin')
        }
        List<String> forbiddenRuntimeMods = runtimeFiles.collect { it.name.toLowerCase(Locale.ROOT) }
                .findAll { name ->
                    name.contains('rf-api') || name.contains('reborncore')
                }
        if (!forbiddenRuntimeMods.isEmpty()) {
            throw new GradleException(
                    "An optional provider mod leaked onto runtimeClasspath: ${forbiddenRuntimeMods}")
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the exact three distributable jars and release-critical contents.'
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('verifyLocalRuntimeInputs')
    dependsOn tasks.named('assemble')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (jars.collect { it.name } != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${jars.collect { it.name }}")
        }
        jars.each { candidate ->
            if (candidate.length() == 0L) {
                throw new GradleException("Empty release artifact: ${candidate.name}")
            }
            new ZipFile(candidate).withCloseable { candidateZip ->
                candidateZip.entries().findAll { entry ->
                    !entry.isDirectory()
                            && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean containsCarriageReturn = candidateZip.getInputStream(entry).withCloseable { input ->
                        input.bytes.any { value -> value == 13 }
                    }
                    if (containsCarriageReturn) {
                        throw new GradleException(
                                "${candidate.name}!/${entry.name} does not use canonical LF line endings")
                    }
                }
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            ['META-INF/mods.toml', 'pack.mcmeta',
             'zone/moddev/mc/baseelectric/ElectricAdvantage.class',
             'zone/moddev/mc/baseelectric/machines/ElectricDrillTileEntity.class',
             'zone/moddev/mc/baseelectric/machines/ElectricPumpTileEntity.class',
             'zone/moddev/mc/baseelectric/machines/HydroelectricGeneratorTileEntity.class',
             'zone/moddev/mc/baseelectric/migration/ElectricLegacyMigrations.class',
             'zone/moddev/mc/baseelectric/init/OreSpawnWorldGen.class',
             'zone/moddev/mc/baseelectric/init/Villages.class',
             'zone/moddev/mc/baseelectric/recipe/RecipeConditions$ModeSerializer.class',
             'assets/baseelectric/lang/en_us.json',
             'data/baseelectric/loot_tables/blocks/electric_drill.json',
             'data/baseelectric/loot_tables/blocks/electric_conduit.json',
             'data/baseelectric/recipes/electric_conduit_plastic_ingot.json',
             'data/baseelectric/advancements/recipes/integrated_circuit_copper_normal.json',
             'data/forge/tags/items/ores/lithium.json'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            ['agent-notes/', '.codex/', 'src/test/', 'fernflower_abstract_parameter_names.txt',
              'cyano/poweradvantage/',
              'zone/moddev/mc/basepower/', 'zone/moddev/mc/poweradvantage/', 'zone/moddev/mc/electricadvantage/',
              'assets/electricadvantage/', 'data/electricadvantage/',
              'zone/moddev/mc/basemetals/', 'cyano/basemetals/', 'com/mcmoddev/lib/',
              'cyano/orespawn/', 'com/mcmoddev/orespawn/', 'cofh/api/', 'reborncore/',
             'net/minecraft/', 'net/minecraftforge/'].each { forbidden ->
                if (names.any { it.contains(forbidden) }) {
                    throw new GradleException("Release jar contains forbidden entry matching ${forbidden}")
                }
            }
            String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText(StandardCharsets.UTF_8.name())
            if (!metadata.contains('modId="baseelectric"')
                    || !metadata.contains("version=\"${project.mod_version}\"")) {
                throw new GradleException('Packaged mods.toml identity or version is incorrect')
            }
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('Built-On-Java') != project.java_version
                    || manifest.getValue('Implementation-Timestamp') != null
                    || manifest.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest identity is incorrect or volatile')
            }
            if (powerPinManifest.any { key, value -> manifest.getValue(key) != value }) {
                throw new GradleException('Player JAR does not record the exact basePower pins')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 61) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 61")
                }
            }
        }

        new ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile).withCloseable { zip ->
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (powerPinManifest.any { key, value -> manifest.getValue(key) != value }) {
                throw new GradleException('Development JAR does not record the exact basePower pins')
            }
        }

        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { sourceZip ->
            if (sourceZip.getEntry('zone/moddev/mc/baseelectric/ElectricAdvantage.java') == null
                    || sourceZip.getEntry('zone/moddev/mc/baseelectric/machines/ElectricDrillTileEntity.java') == null) {
                throw new GradleException('Sources jar is missing required baseElectric sources')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { javadocZip ->
            if (javadocZip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(provider { expectedReleaseFiles.get().collect { layout.buildDirectory.file("libs/${it}").get().asFile } })
    outputs.file(outputFile)
    inputs.files(expectedReleaseFiles.map { names -> names.collect { layout.buildDirectory.file("libs/${it}").get().asFile } })
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits an immutable release bundle before Maven publication.'
    doLast {
        requirePowerPin()
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (!prepared.isDirectory() || jars.collect { it.name } != expected
                || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly the non-empty jars ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }
        List<String> actualChecksums = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        List<String> declaredChecksums = checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.sort()
        if (actualChecksums != declaredChecksums) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
    }
}

