}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.toml', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    String configuredRunDirectory = providers.gradleProperty('electricAdvantageRunDirectory')
            .getOrElse('run')
    def forgeRunModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/main')
    def forgeMainOutputPath = forgeRunModClassesDirectory.get().asFile.absolutePath
    def mainModClasses = "${mod_id}%%${forgeMainOutputPath}${File.pathSeparator}${mod_id}%%${forgeMainOutputPath}"
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            mods { baseelectric { source sourceSets.main } }
            environment 'MOD_CLASSES', mainModClasses
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

