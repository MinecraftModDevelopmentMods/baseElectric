def committedPins = new Properties()
file('gradle.properties').withInputStream { committedPins.load(it) }
def requireCommittedPins = { String prefix ->
    committedPins.stringPropertyNames().findAll { key ->
        key.startsWith(prefix) && (key.endsWith('_sha256') || key.endsWith('_ref')
                || key.endsWith('_commit') || key.endsWith('_pin_state') || key.endsWith('_version')
                || key.endsWith('_built_on'))
    }.each { key ->
        if (project.property(key) != committedPins.getProperty(key)) {
            throw new GradleException("Cannot override the recorded release pin ${key}.")
        }
    }
}
def requirePowerPin = {
    requireCommittedPins('poweradvantage_')
    if (!(project.poweradvantage_pin_state in ['LOCAL_SOURCE', 'MERGED_SOURCE'])
            || !(project.poweradvantage_source_ref ==~ /[a-f0-9]{40}/)
            || ![project.poweradvantage_deobf_sha256, project.poweradvantage_runtime_sha256]
                    .every { it ==~ /[A-F0-9]{64}/ }) {
        throw new GradleException('The owner-approved basePower 26.1.2 source and artifact pins are required.')
    }
}
