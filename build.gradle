def javadocLegalNames = ['LICENSE', 'ADDITIONAL_LICENSE_INFO', 'ASSEMBLY_EXCEPTION']
tasks.named('javadoc', Javadoc) {
    inputs.files(javadocTool.map { tool ->
        javadocLegalNames.collect { tool.metadata.installationPath.file("legal/java.base/${it}").asFile }
    })
    doLast {
        File legalRoot = javadocTool.get().metadata.installationPath.dir('legal/java.base').asFile
        javadocLegalNames.each { name ->
            if (!new File(legalRoot, name).isFile()) {
                throw new GradleException("Selected JDK is missing legal/java.base/${name}")
            }
        }
        // Windows JDK module notices point outside the generated documentation.
        project.copy {
            from legalRoot
            include javadocLegalNames
            into new File(destinationDir, 'legal')
            filesMatching(javadocLegalNames, normalizeArchiveLineEndings)
        }
    }
}

