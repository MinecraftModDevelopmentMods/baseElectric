plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'baseElectric'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: "
            + project.minecraft_version)
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

def sha256Of = { File input ->
    MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString().toUpperCase()
}

def pinnedFile = { String property, String expected ->
    if (!(expected ==~ /[A-F0-9]{64}/)) {
        throw new GradleException("No approved SHA-256 for -P${property}.")
    }
    File input = providers.gradleProperty(property).map { file(it) }.orNull
    if (input == null || !input.isFile()) {
        throw new GradleException("Pass the exact local input with -P${property}=<path> (received ${input}).")
    }
    String actual = sha256Of(input)
    if (actual != expected) {
        throw new GradleException("${property} SHA-256 mismatch for ${input}: expected ${expected}, got ${actual}.")
    }
    input
}

// The IAF118/OreSpawn fixture fixes the Forge 40 Holder record decompilation.
// Its build-tool JVM is separate from the Java 17 production/test JVM.
fgtools.configure('mavenizer') {
    classpath.from(providers.provider {
        pinnedFile('mavenizerCompatibilityJar', '28A6697BDF6D9500EC0AF9C1C949B9F3ED7DDFDA649CB5CAC4BEEA2E9567570A')
    })
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    options.release = 17
    options.encoding = 'UTF-8'
