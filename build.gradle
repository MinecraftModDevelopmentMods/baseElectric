        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                'Built-On-Java'         : project.java_version,
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ] + powerPinManifest)
    }
}

