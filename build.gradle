def prepareElectricGameTestFixture = tasks.register('prepareElectricGameTestFixture') {
    doLast {
        File directory = electricGameTestRunDirectory.asFile.canonicalFile
        if (!directory.toPath().startsWith(layout.buildDirectory.dir('port-evidence').get().asFile.canonicalFile.toPath())
                || directory.exists()) {
            throw new GradleException('Use a new GameTest run directory inside build/port-evidence.')
        }
        String eulaPath = providers.gradleProperty('electricGameTestEula').getOrElse('')
        if (!eulaPath || !file(eulaPath).isFile() || !(file(eulaPath).text =~ /(?m)^eula=true\s*$/).find()) {
            throw new GradleException('Pass an existing accepted EULA with -PelectricGameTestEula=<path>.')
        }
        if (!directory.mkdirs()) throw new GradleException("Cannot create GameTest directory ${directory}")
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\n'
        File config = new File(directory, 'config')
        config.mkdirs()
        new File(config, 'fml.toml').text = 'versionCheck = false\n'
    }
}
tasks.withType(JavaExec).configureEach {
    jvmArgs '-XX:ActiveProcessorCount=4'
    environment = environment.findAll { key, value ->
        !(key in ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'])
    }
    if (name in ['runClient', 'runServer', 'runData']) {
        dependsOn prepareForgeRunModClasses
    }
    if (name == 'runGameTestServer') {
        dependsOn prepareElectricGameTestMod, prepareElectricGameTestFixture
        doFirst {
            Set<File> splitOutputs = sourceSets.collectMany { it.output.files }.collect { it.canonicalFile } as Set
            classpath = files(gameTestModOutput, classpath.files.findAll { !splitOutputs.contains(it.canonicalFile) })
        }
        doLast {
            File report = new File(electricGameTestRunDirectory.asFile, 'game-test-results.xml')
            if (!report.isFile()) throw new GradleException('Native Electric GameTest report is missing')
            def document = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(report)
            def cases = document.getElementsByTagName('testcase')
            Set<String> names = (0..<cases.length).collect { cases.item(it).getAttribute('name') } as Set<String>
            Set<String> expected = ['drillupgradesandtransferslegacybattery', 'recipeavailabilitydoesnotremovediscovery',
                    'siliconandsolderresolverealmaterialtags', 'turretusesnativeupdatepacket']
                    .collect { "baseelectric:${it}".toString() } as Set<String>
            if (cases.length != 4 || names != expected
                    || ['failure', 'error', 'skipped'].any { document.getElementsByTagName(it).length != 0 }) {
                throw new GradleException("Expected all four native Electric tests without skips/failures, got ${names}")
            }
        }
    }
}

