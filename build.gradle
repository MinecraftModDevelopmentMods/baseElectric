            || project.poweradvantage_source_ref != 'bcf5105ef5c10ba36c26c8ff941742fecc3e11a1'
            || project.poweradvantage_deobf_sha256 != '767BABC0D6E1536DCB937B9F1DC565AF348B3CAF92D3207671EF1E1C8D8EF5D4'
            || project.poweradvantage_runtime_sha256 != '8CA46D5BCBFFDDAEB4F40137B5BF71E5AF7DD36515E5BFEA751FC5C02249823B'
            || project.poweradvantage_unit_bootstrap_sha256 != '025F16FCA9FD5CFC585931E7C8BCFAB22FC1DF933BE7DAAD490B8E4FC824B76E') {
        throw new GradleException('The published basePower 2.4.10.118021 source and artifact pins do not match.')
    }
}

