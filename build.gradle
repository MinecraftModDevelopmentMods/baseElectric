}

def unitBootstrapSource = providers.provider {
    pinnedFile('powerAdvantageUnitBootstrapSource', project.poweradvantage_unit_bootstrap_sha256)
}
def compileUnitBootstrap = tasks.register('compileUnitBootstrap', JavaCompile) {
    source unitBootstrapSource, file('tools/verification/ForgeNativeTestBootstrap.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('unit-bootstrap/classes')
    inputs.property('approvedSourceSha256', project.poweradvantage_unit_bootstrap_sha256)
    doFirst {
        unitBootstrapSource.get()
    }
}
def unitBootstrapJar = tasks.register('unitBootstrapJar', Jar) {
    dependsOn compileUnitBootstrap
    archiveFileName = 'forge-native-unit-bootstrap.jar'
    destinationDirectory = layout.buildDirectory.dir('unit-bootstrap')
    from compileUnitBootstrap.flatMap { it.destinationDirectory }
    manifest.attributes('Premain-Class': 'zone.moddev.mc.baseelectric.verification.ForgeNativeTestBootstrap')
}

tasks.named('test', Test) {
    dependsOn unitBootstrapJar
    doFirst { jvmArgs "-javaagent:${unitBootstrapJar.get().archiveFile.get().asFile}" }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    afterSuite { descriptor, result ->
        if (!descriptor.parent && (result.testCount != 96 || result.skippedTestCount != 0)) {
            throw new GradleException("Expected 96 tests with no skips, got ${result.testCount} tests and ${result.skippedTestCount} skips")
        }
    }
}

tasks.withType(Javadoc).configureEach {
